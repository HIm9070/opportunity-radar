<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار الفرص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEBFF;--bg2:#E2DBFF;--ink:#1B1240;--mut:#5B5380;--card:rgba(255,255,255,.75);--line:rgba(27,18,64,.14);--a1:#6C4CF1;--a2:#E8456B;--a3:#0F9F8F;--node:108,76,241;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150E36;--bg2:#241757;--ink:#F3F0FF;--mut:#A9A0D6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--a1:#8F7BFF;--a2:#FF6B8B;--a3:#5EEAD4;--node:160,140,255;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150E36;--bg2:#241757;--ink:#F3F0FF;--mut:#A9A0D6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--a1:#8F7BFF;--a2:#FF6B8B;--a3:#5EEAD4;--node:160,140,255;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:hidden;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{animation:drift 22s ease-in-out infinite alternate;position:fixed;inset:-20% -10% auto auto;width:70vmax;height:70vmax;background:radial-gradient(circle,var(--bg2),transparent 65%);z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 20px 70px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px "Reem Kufi",sans-serif}
@keyframes drift{to{transform:translate(-9vmax,7vmax) scale(1.18)}}
.glow.b{inset:auto auto -25% -15%;animation-duration:30s;animation-direction:alternate-reverse;opacity:.7}
.dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 18px var(--a1);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35);box-shadow:0 0 30px var(--a2)}}
h1{font:700 clamp(40px,9vw,66px)/1.25 "Reem Kufi",sans-serif;margin:44px 0 10px}
h1 span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(.96);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.16s + .15s)}
@keyframes rise{to{opacity:1;filter:blur(0);transform:none}}
.sub{color:var(--mut);max-width:36em;margin:0 0 26px;opacity:0;animation:rise .9s .8s forwards}
.lab{display:inline-flex;align-items:center;gap:10px;margin:0 0 24px;padding:9px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;opacity:0;animation:rise .9s .95s forwards;transition:border-color .3s,box-shadow .4s,transform .2s}
.lab:hover{border-color:var(--a1);box-shadow:0 10px 30px -12px rgba(var(--node),.6);transform:translateY(-2px)}
.lab:focus-visible{outline:2px solid var(--a3);outline-offset:3px}
.lab i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--a3),var(--a1));box-shadow:0 0 12px var(--a3)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;opacity:0;animation:rise .9s 1s forwards}
.bar input[type=search],.bar select{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 18px;color:var(--ink);font:inherit;font-size:15px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.bar label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:15px;cursor:pointer}
.bar input:focus-visible,.bar select:focus-visible,.btn:focus-visible,.bar input[type=checkbox]:focus-visible{outline:2px solid var(--a3);outline-offset:3px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}
.stat{flex:1 1 130px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:reveal .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*.12s + .2s)}
.stat b{display:block;font:700 32px/1.3 "Reem Kufi",sans-serif;color:var(--a1)}
.stat span{font-size:14px;color:var(--mut)}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.th{font:inherit;font-size:14px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 16px;cursor:pointer;transition:border-color .25s,color .25s,transform .2s,box-shadow .3s}
.th:hover{border-color:var(--a1);color:var(--ink);transform:translateY(-2px)}
.th[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--a1),var(--a2));box-shadow:0 8px 22px -10px var(--a2)}
.th:focus-visible{outline:2px solid var(--a3);outline-offset:3px}
.count{color:var(--mut);font-size:14px;margin:0 4px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{position:relative;overflow:hidden;opacity:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:perspective(900px) translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,border-color .3s,box-shadow .4s}
.card.in{opacity:1;animation:reveal .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes reveal{from{opacity:0;filter:blur(12px);transform:perspective(900px) translateY(34px) scale(.96)}}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(var(--node),.24),transparent 62%)}
.card:hover{--ty:-5px;border-color:var(--a1);box-shadow:0 18px 44px -18px rgba(var(--node),.55)}
.card:hover:before{opacity:1}
.card.hot{border-color:rgba(232,69,107,.55);box-shadow:0 0 0 1px rgba(232,69,107,.18),0 14px 40px -16px rgba(232,69,107,.5)}
.card h3{font:700 20px/1.55 "IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;letter-spacing:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:1px 11px;color:var(--mut)}
.tag.prize{color:var(--a3);border-color:var(--a3)}
.card p{margin:0;color:var(--mut);font-size:15px}
.when{font-size:14px;color:var(--mut)}
.left{align-self:flex-start;font-weight:600;font-size:14px;padding:3px 14px;border-radius:99px;background:rgba(var(--node),.16);color:var(--a1)}
.left.soon{background:rgba(232,69,107,.16);color:var(--a2);animation:pulse2 1.8s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.6}}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:99px;padding:7px 18px;font-size:15px;font-weight:500;border:1px solid var(--line);color:var(--ink);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.main{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(120deg,var(--a1),var(--a2))}
.btn.main:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(130%);animation:sheen 4s 2.2s ease-in-out infinite}
@keyframes sheen{40%,100%{transform:translateX(-130%)}}
.empty,.err{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;color:var(--mut)}
.err{color:var(--a2)}
footer{margin-top:40px;color:var(--mut);font-size:14px;text-align:center}
footer a{color:var(--a1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div><div class="glow b"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="brand"><i class="dot"></i>رادار الفرص</div>
  <h1 aria-label="كل هاكاثونات المملكة في مكان واحد"><span style="--i:0">كل</span> <span style="--i:1">هاكاثونات</span> <span style="--i:2">المملكة</span> <span style="--i:3">في</span> <span style="--i:4">مكان</span> <span style="--i:5">واحد</span></h1>
  <p class="sub">تتحدّث الفرص تلقائياً كل ٣ ساعات من قناة هاكثونات على تلجرام، وما انتهى موعده يختفي من الصفحة.</p>
  <a class="lab" href="lab.html"><i></i>عندك فكرة مشروع؟ اختبرها في مختبر الأفكار</a>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="ابحث باسم الفرصة أو المسار أو المدينة" aria-label="بحث">
    <select id="mode" aria-label="نوع الحضور"><option value="">حضوري وعن بعد</option><option value="حضوري">حضوري</option><option value="عن بعد">عن بعد</option></select>
    <select id="city" aria-label="المدينة"><option value="">كل المدن</option></select>
    <label><input type="checkbox" id="prize"> لها جوائز</label>
  </div>
  <div class="themes" id="themes" role="group" aria-label="تصفية حسب المجال"></div>
  <div class="count" id="count" role="status" aria-live="polite"></div>
  <div id="list" class="grid"></div>
  <footer id="foot"></footer>
</main>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const safe=u=>/^https?:\/\//.test(u||'')?u:null;
let ALL=[],theme='';

const nz=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const nt=s=>' '+nz(s).replace(/(^| )(وال|بال|كال|فال|لل|ال)(?=\S{2})/g,'$1')+' ';
const re=k=>new RegExp(k.endsWith('=')?' '+k.slice(0,-1)+' ':' '+k);
const T=[
['الذكاء الاصطناعي',['ذكاء','ai=','تعلم الي','تعلم عميق','نموذج لغ','llm','روبوت','رؤيه حاسوب','تحليل بيانات','بيانات']],
['الصحة',['صحه','صحيه','طبي','طبيب','مريض','مرضي','دواء','ادويه','علاج','مستشفي','عياد','تمريض','جرعه','طب=']],
['التعليم',['تعليم','طلاب','طالب','معلم','مدرس','مدرب','جامع','تدريب','مهارات','خريج','دراس']],
['المال والتقنية المالية',['مالي','دفع','بنك','استثمار','تمويل','فنتك','fintech','ادخار','تامين','محفظ','قرض','مصرف']],
['الأمن السيبراني',['سيبران','اختراق','تشفير','خصوصي','احتيال','cyber','امن معلومات','حمايه']],
['البيئة والاستدامة',['بيئ','استدام','نفايات','تدوير','طاقه','مناخ','كربون','مياه','تلوث','esg']],
['الغذاء والزراعة',['زراع','غذاء','غذائ','مطعم','مطاعم','هدر','طعام','اغذيه','مزرع','محصول']],
['النقل واللوجستيات',['نقل','مرور','توصيل','لوجست','شحن','سياره','مركبات','طيران','مواصلات','امداد']],
['السياحة والثقافة',['سياح','حج=','حجاج','عمره','زائر','فندق','سفر','تراث','ثقاف','ترفيه','فعاليات']],
['الحكومة والمدن الذكية',['حكوم','بلدي','مدن','رقمنه','تحول رقمي','خدمات عام']],
['التجارة وريادة الأعمال',['تجار','متجر','تسويق','مبيعات','ريادي','ناشئه','عملاء','سوق','تجزئه']],
['الألعاب والإبداع',['العاب','لعبه','gaming','محتوي','فيديو','تصميم','ابداع','موسيق','واقع معزز','واقع افتراضي']],
['الوصول وكبار السن',['اعاقه','كبار سن','مسن','كفيف','صم=','ذوي']]
].map(([n,ks])=>({n,rs:ks.map(re)}));
const themesOf=t=>T.filter(x=>x.rs.some(r=>r.test(t))).map(x=>x.n);

const clean=s=>String(s||'').replace(/[\p{Extended_Pictographic}\uFE0F\u200d\u0640#]/gu,'').replace(/_/g,' ').replace(/\s+/g,' ').replace(/^[\s\-–—|:•*.]+|[\s\-–—|:•*.]+$/g,'');
const tidy=s=>{s=clean(s);if(s.length>=250){s=s.slice(0,250);s=s.slice(0,s.lastIndexOf(' '))+'…'}return s};
const io=new IntersectionObserver(es=>{let k=0;es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const t=e.target;setTimeout(()=>t.classList.add('in'),k++*90)}})},{threshold:.06});
let first=true;
function countUp(n){const e=$('#count');if(still||!first){e.textContent=`${AR(n)} فرصة متاحة الآن`;return}first=false;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900),v=Math.round(n*(1-Math.pow(1-p,3)));e.textContent=`${AR(v)} فرصة متاحة الآن`;if(p<1)requestAnimationFrame(f)})(t0)}

/* خلفية العقد */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,P=[],mx=-999,my=-999;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);W=innerWidth;H=innerHeight;
 P=Array.from({length:Math.min(55,Math.floor(W*H/16000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1+Math.random()*2}))}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
function frame(){cx.clearRect(0,0,W,H);const c=getComputedStyle(document.documentElement).getPropertyValue('--node').trim();
 for(const p of P){p.x+=p.vx;p.y+=p.vy;const dx=mx-p.x,dy=my-p.y;if(Math.hypot(dx,dy)<160){p.x+=dx*.004;p.y+=dy*.004}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
 for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){cx.strokeStyle=`rgba(${c},${(1-d/130)*.3})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
  cx.fillStyle=`rgba(${c},.75)`;cx.beginPath();cx.arc(a.x,a.y,a.r,0,7);cx.fill()}
 if(!still)requestAnimationFrame(frame)}
frame();

/* البيانات */
function urls(){const u=[],h=location.hostname;
 if(h.endsWith('.github.io')){const o=h.split('.')[0],r=location.pathname.split('/')[1];if(r)u.push(`https://raw.githubusercontent.com/${o}/${r}/main/data/opportunities.json`)}
 u.push('data/opportunities.json');return u}
async function load(){for(const u of urls()){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}return null}
const daysLeft=d=>d?Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5):null;
const alive=i=>{const d=daysLeft(i.until);if(d!==null)return d>=0;return !i.posted||(Date.now()-new Date(i.posted))<45*864e5};

function card(i,n){
 const c=el('article','card');c.style.setProperty('--n',Math.min(n,12));
 c.append(el('h3',null,clean(i.name)));
 const m=el('div','meta');[i.city,i.mode].filter(Boolean).forEach(t=>m.append(el('span','tag',t)));
 if(i.prize)m.append(el('span','tag prize','لها جوائز'));c.append(m);
 const d=daysLeft(i.closes);
 if(d!==null){const t=d===0?'يغلق التسجيل اليوم':`يغلق التسجيل بعد ${AR(d)} ${d===1?'يوم':d===2?'يومين':d<=10?'أيام':'يوماً'}`;c.append(el('span','left'+(d<=3?' soon':''),t));if(d<=3)c.classList.add('hot')}
 else c.append(el('span','left','التسجيل مفتوح'));
 if(i.summary)c.append(el('p',null,tidy(i.summary)));
 if(i.eventText)c.append(el('div','when','موعد الفعالية: '+i.eventText));
 if(i.prize)c.append(el('div','when','الجوائز: '+i.prize));
 const a=el('div','acts');const l=safe(i.link);
 if(l){const b=el('a','btn main','سجّل الآن');b.href=l;b.target='_blank';b.rel='noopener noreferrer';a.append(b)}
 const t=safe(i.tgUrl);if(t){const b=el('a','btn','الرسالة في تلجرام');b.href=t;b.target='_blank';b.rel='noopener noreferrer';a.append(b)}
 c.append(a);
 if(!still){c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.setProperty('--rx',(.5-y)*6+'deg');c.style.setProperty('--ry',(x-.5)*6+'deg')});c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')})}
 return c}

function ticker(e,n){if(still){e.textContent=AR(n);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1000);e.textContent=AR(Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)})(t0)}
function stats(){const box=$('#stats');box.textContent='';if(!ALL.length)return;
 const w=ALL.filter(i=>{const d=daysLeft(i.closes);return d!==null&&d>=0&&d<=7}).length;
 [[ALL.length,'فرصة مفتوحة الآن'],[w,'تغلق خلال أسبوع'],[ALL.filter(i=>i.prize).length,'لها جوائز']].forEach(([n,l],k)=>{const s=el('div','stat'),b=el('b',null,'٠');s.style.setProperty('--n',k);s.append(b,el('span',null,l));box.append(s);ticker(b,n)})}
function chips(){const c={};ALL.forEach(i=>(i._th||[]).forEach(n=>c[n]=(c[n]||0)+1));
 const box=$('#themes');box.textContent='';const names=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,8);if(!names.length)return;
 [['','الكل'],...names.map(n=>[n,`${n} ${AR(c[n])}`])].forEach(([n,t])=>{const b=el('button','th',t);b.type='button';b.setAttribute('aria-pressed',String(n===theme));b.onclick=()=>{theme=n;[...box.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');draw()};box.append(b)})}
function draw(){
 const q=$('#q').value.trim(),mode=$('#mode').value,city=$('#city').value,pz=$('#prize').checked;
 const rows=ALL.filter(i=>(!q||[i.name,i.summary,i.city,(i.tracks||[]).join(' ')].join(' ').includes(q))
  &&(!mode||(i.mode||'').includes(mode))&&(!city||i.city===city)&&(!theme||(i._th||[]).includes(theme))&&(!pz||i.prize));
 const g=$('#list');g.textContent='';
 rows.forEach((i,n)=>{const c=card(i,n);g.append(c);io.observe(c)});
 if(rows.length)countUp(rows.length);else $('#count').textContent='';
 if(!rows.length&&ALL.length){const e=el('div','empty','لا توجد فرص تطابق بحثك. جرّب تغيير الفلاتر.');e.style.gridColumn='1/-1';g.append(e)}
}
['q','mode','city','prize'].forEach(id=>$('#'+id).addEventListener('input',draw));

(async()=>{
 const data=await load();const g=$('#list');
 if(!data){const e=el('div','err','تعذّر تحميل الفرص الآن. حدّث الصفحة بعد قليل.');e.style.gridColumn='1/-1';g.append(e);return}
 ALL=(data.items||[]).filter(alive).sort((a,b)=>(a.until||'9999').localeCompare(b.until||'9999'));

name: تحديث الفرص

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-opportunities
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: قراءة القناة
        run: node scripts/update.mjs
      - name: حفظ التحديث
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || (git commit -m "تحديث الفرص" && git push)

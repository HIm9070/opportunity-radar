<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الأفكار | رادار الفرص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120C32;--bg2:#2A1A74;--ink:#F3F0FF;--mut:#A9A0D6;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--a1:#8F7BFF;--a2:#FF6B8B;--a3:#5EEAD4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:hidden;min-height:100vh}
.glow{position:fixed;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,var(--bg2),transparent 65%);inset:-25% -15% auto auto;z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.glow.b{inset:auto auto -30% -20%;opacity:.6;animation-duration:30s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(-8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:26px 20px 70px}
.brand{display:inline-flex;align-items:center;gap:10px;font:700 20px "Reem Kufi",sans-serif;color:var(--ink);text-decoration:none}
.dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 18px var(--a1);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35);box-shadow:0 0 30px var(--a2)}}
h1{font:700 clamp(38px,8.5vw,62px)/1.3 "Reem Kufi",sans-serif;margin:42px 0 12px}
h1 span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(.96);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.15s + .15s)}
@keyframes rise{to{opacity:1;filter:blur(0);transform:none}}
.sub{color:var(--mut);max-width:34em;margin:0 0 26px;opacity:0;animation:rise .9s .7s forwards}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;animation:rise .9s .9s forwards;transition:border-color .3s,box-shadow .4s}
.box:focus-within{border-color:var(--a1);box-shadow:0 0 0 4px rgba(143,123,255,.14),0 20px 50px -24px var(--a1)}
textarea{width:100%;min-height:120px;resize:vertical;background:transparent;border:0;color:var(--ink);font:inherit;font-size:17px;outline:0}
textarea::placeholder{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{font:inherit;font-size:14px;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:5px 14px;cursor:pointer;transition:border-color .25s,color .25s,transform .2s}
.chip:hover{border-color:var(--a1);color:var(--ink);transform:translateY(-2px)}
.go{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:12px;font:600 18px "IBM Plex Sans Arabic",sans-serif;color:#fff;border:0;border-radius:99px;padding:14px 34px 14px 30px;cursor:pointer;background:linear-gradient(100deg,#6C4CF1,#8F7BFF,#E04066,#8F7BFF,#6C4CF1) 0 0/200% 100%;animation:flow 6s linear infinite;box-shadow:0 14px 38px -12px rgba(224,64,102,.7),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
@keyframes flow{to{background-position:200% 0}}
.go:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(130%);animation:sheen 4.5s 1.5s ease-in-out infinite}
@keyframes sheen{35%,100%{transform:translateX(-130%)}}
.go svg{width:22px;height:22px;flex:none;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.go:hover{transform:translateY(-3px);box-shadow:0 20px 44px -12px rgba(224,64,102,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.go:hover svg{transform:rotate(200deg) scale(1.12)}
.go:active{transform:translateY(0) scale(.97)}
.go.busy{pointer-events:none;filter:saturate(.75)}
.go.busy svg{animation:spin 1s linear infinite}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--a3);outline-offset:3px}
.hint{color:var(--a2);font-size:14px;margin:8px 0 0;min-height:1.6em}
.scan{width:130px;height:130px;border-radius:50%;margin:44px auto;position:relative;border:1px solid var(--line);background:repeating-radial-gradient(circle,transparent 0 21px,rgba(143,123,255,.3) 22px)}
.scan:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(94,234,212,.6),transparent 36%);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sum{margin:30px 4px 14px;color:var(--mut);font-size:15px}
.sum b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:14px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:reveal .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n)*.12s);transition:border-color .3s,box-shadow .4s,transform .25s}
@keyframes reveal{from{opacity:0;filter:blur(12px);transform:translateY(30px) scale(.97)}}
.card:hover{border-color:var(--a1);box-shadow:0 18px 44px -20px var(--a1);transform:translateY(-4px)}
.card h3{font:700 20px/1.55 "IBM Plex Sans Arabic",sans-serif;margin:0}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--a3);font-weight:600}
.meter i{flex:0 0 90px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i:after{content:"";display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--a3),var(--a1));transform-origin:right;animation:fill 1.1s cubic-bezier(.2,.8,.2,1) .5s backwards}
@keyframes fill{from{transform:scaleX(0)}}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:1px 11px;color:var(--mut)}
.tag.why{color:var(--a1);border-color:var(--a1)}
.tag.prize{color:var(--a3);border-color:var(--a3)}
.left{align-self:flex-start;font-weight:600;font-size:14px;padding:3px 14px;border-radius:99px;background:rgba(143,123,255,.18);color:var(--a1)}
.left.soon{background:rgba(255,107,139,.18);color:var(--a2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.btn{display:inline-block;text-decoration:none;border-radius:99px;padding:7px 18px;font-size:15px;font-weight:500;border:1px solid var(--line);color:var(--ink);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.main{border:0;background:linear-gradient(120deg,var(--a1),var(--a2))}
.empty{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;color:var(--mut)}
.more{margin-top:38px;display:flex;justify-content:center}
.all{position:relative;display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:99px;color:var(--ink);text-decoration:none;font-weight:600;font-size:17px;border:1px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(120deg,var(--a3),var(--a1),var(--a2)) border-box;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.all svg{width:20px;height:20px;flex:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.all .ch{color:var(--a3)}
.all:hover{transform:translateY(-3px);box-shadow:0 14px 36px -14px var(--a1),0 0 0 4px rgba(143,123,255,.12)}
.all:hover .ch{transform:translateX(-5px)}
.all:active{transform:scale(.97)}
.note{text-align:center;margin-top:18px;color:var(--mut);font-size:14px}
.note a{color:var(--a1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div><div class="glow b"></div>
<main>
  <a class="brand" href="index.html"><i class="dot"></i>رادار الفرص</a>
  <h1 aria-label="جرّب فكرتك على الفرص المفتوحة"><span style="--i:0">جرّب</span> <span style="--i:1">فكرتك</span> <span style="--i:2">على</span> <span style="--i:3">الفرص</span> <span style="--i:4">المفتوحة</span></h1>
  <p class="sub">اكتب فكرة مشروعك في كم سطر، ويطلع لك الرادار الهاكاثونات والمسابقات المفتوحة اللي تناسبها.</p>
  <div class="box">
    <textarea id="idea" aria-label="فكرة المشروع" placeholder="مثال: تطبيق يذكّر كبار السن بأدويتهم ويبلّغ أهلهم إذا فاتتهم جرعة..."></textarea>
    <div class="chips" id="chips"></div>
    <button class="go" id="go" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5" opacity=".6"/><path d="M12 12L18 6"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>اختبر فكرتي</span></button>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </div>
  <div class="scan" id="scan" hidden aria-label="جاري المطابقة"></div>
  <div id="out" aria-live="polite"></div>
  <div class="more"><a class="all" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5" opacity=".6"/><path d="M12 12L18 6"/></svg><span>شوف كل الفرص المفتوحة</span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></div>
  <p class="note">المطابقة بالكلمات والمجالات وليست تحليل ذكاء اصطناعي، فاكتب فكرتك بتفصيل يوضح المجال والمستفيد.</p>
</main>
<script>
/*ENGINE*/
const nz=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const nt=s=>' '+nz(s).replace(/(^| )(وال|بال|كال|فال|لل|ال)(?=\S{2})/g,'$1')+' ';
const clean=s=>String(s||'').replace(/[\p{Extended_Pictographic}\uFE0F\u200d\u0640#]/gu,'').replace(/_/g,' ').replace(/\s+/g,' ').replace(/^[\s\-–—|:•*.]+|[\s\-–—|:•*.]+$/g,'');
const STOP=new Set('فكره مشروع تطبيق نظام منصه يساعد ويساعد يبلغ ويبلغ هاكاثون هاكثون مسابقه مسابقات فرصه فرص يمكن عندي لدي ابغي ابي يكون هذا هذه الذي التي مثل خلال عبر بين حتي اذا اذا لكل كل'.split(' '));
const re=k=>new RegExp(k.endsWith('=')?' '+k.slice(0,-1)+' ':' '+k);
const T=[
['الذكاء الاصطناعي',['ذكاء','ai=','تعلم الي','تعلم عميق','نموذج لغ','llm','روبوت','رؤيه حاسوب','تحليل بيانات','بيانات']],
['الصحة',['صحه','صحيه','طبي','طبيب','مريض','مرضي','دواء','ادويه','علاج','مستشفي','عياد','تمريض','جرعه','طب=']],
['التعليم',['تعليم','طلاب','طالب','معلم','مدرس','مدرب','جامع','تدريب','مهارات','خريج','دراس']],
['المال والتقنية المالية',['مالي','دفع','بنك','استثمار','تمويل','فنتك','fintech','ادخار','تامين','محفظ','قرض','مصرف']],
['الأمن السيبراني',['سيبران','اختراق','تشفير','خصوصي','احتيال','cyber','امن معلومات','حمايه']],
['البيئة والاستدامة',['بيئ','استدام','نفايات','تدوير','طاقه','مناخ','كربون','مياه','تلوث','esg']],
['الغذاء والزراعة',['زراع','غذاء','غذائ','مطعم','مطاعم','هدر','طعام','اغذيه','مزرع','محصول']],
['النقل واللوجستيات',['نقل','مرور','توصيل','لوجست','شحن','سياره','مركبات','طيران','مواصلات','امداد']],
['السياحة والثقافة',['سياح','حج=','حجاج','عمره','زائر','فندق','سفر','تراث','ثقاف','ترفيه','فعاليات']],
['الحكومة والمدن الذكية',['حكوم','بلدي','مدن','رقمنه','تحول رقمي','خدمات عام']],
['التجارة وريادة الأعمال',['تجار','متجر','تسويق','مبيعات','ريادي','ناشئه','عملاء','سوق','تجزئه']],
['الألعاب والإبداع',['العاب','لعبه','gaming','محتوي','فيديو','تصميم','ابداع','موسيق','واقع معزز','واقع افتراضي']],
['الوصول وكبار السن',['اعاقه','كبار سن','مسن','كفيف','صم=','ذوي']]
].map(([n,ks])=>({n,rs:ks.map(re)}));
const themesOf=t=>T.filter(x=>x.rs.some(r=>r.test(t))).map(x=>x.n);
const toks=s=>[...new Set(nz(s).split(' ').map(w=>w.replace(/^(وال|بال|كال|فال|لل|ال)(?=\S{2})/,'')).filter(w=>w.length>=4&&!STOP.has(w)))];
function score(idea,o){
 const it=nt(idea),ot=nt([o.name,o.summary,(o.tracks||[]).join(' ')].join(' '));
 const th=themesOf(it),sh=th.filter(n=>themesOf(ot).includes(n));
 const ot2=new Set(toks(ot)),words=toks(idea).filter(w=>ot2.has(w));
 return{s:sh.length*4+Math.min(words.length,4)*1.5,why:sh.concat(sh.length?[]:words.slice(0,2)),th}}
/*END*/
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const safe=u=>/^https?:\/\//.test(u||'')?u:null;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const daysLeft=d=>d?Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5):null;
const alive=i=>{const d=daysLeft(i.until);if(d!==null)return d>=0;return !i.posted||(Date.now()-new Date(i.posted))<45*864e5};
function urls(){const u=[],h=location.hostname;
 if(h.endsWith('.github.io')){const o=h.split('.')[0],r=location.pathname.split('/')[1];if(r)u.push(`https://raw.githubusercontent.com/${o}/${r}/main/data/opportunities.json`)}
 u.push('data/opportunities.json');return u}
async function load(){for(const u of urls()){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}return null}

const EX=['تطبيق يذكّر كبار السن بأدويتهم ويبلّغ أهلهم إذا فاتتهم جرعة','منصة تربط الطلاب بمدربين من خريجي تخصصهم','نظام يقلل هدر الطعام في المطاعم'];
EX.forEach(t=>{const b=el('button','chip',t);b.type='button';b.onclick=()=>{$('#idea').value=t;$('#idea').focus()};$('#chips').append(b)});

function card(o,r,n,top){
 const c=el('article','card');c.style.setProperty('--n',n);c.append(el('h3',null,clean(o.name)));
 const pct=Math.min(100,Math.round(r.s/top*100)),lv=r.s>=8?'تطابق قوي':r.s>=4?'تطابق جيد':'تطابق محتمل';
 const m=el('div','meter',lv);const bar=el('i');bar.style.setProperty('--w',pct+'%');m.prepend(bar);c.append(m);
 const g=el('div','meta');r.why.forEach(w=>g.append(el('span','tag why',w)));[o.city,o.mode].filter(Boolean).forEach(t=>g.append(el('span','tag',t)));if(o.prize)g.append(el('span','tag prize','لها جوائز'));c.append(g);
 const d=daysLeft(o.closes);
 c.append(el('span','left'+(d!==null&&d<=3?' soon':''),d===null?'التسجيل مفتوح':d===0?'يغلق التسجيل اليوم':`يغلق التسجيل بعد ${AR(d)} ${d===1?'يوم':d===2?'يومين':d<=10?'أيام':'يوماً'}`));
 const a=el('div','acts'),l=safe(o.link),t=safe(o.tgUrl);
 if(l){const b=el('a','btn main','سجّل الآن');b.href=l;b.target='_blank';b.rel='noopener noreferrer';a.append(b)}
 if(t){const b=el('a','btn','التفاصيل في تلجرام');b.href=t;b.target='_blank';b.rel='noopener noreferrer';a.append(b)}
 c.append(a);return c}

let busy=false;
async function run(){
 const idea=$('#idea').value.trim(),hint=$('#hint'),out=$('#out');
 if(busy)return;hint.textContent='';
 if(idea.length<15){hint.textContent='اكتب فكرتك في سطرين على الأقل عشان أقدر أطابقها.';return}
 busy=true;$('#go').classList.add('busy');$('#go span').textContent='جاري الفحص…';out.textContent='';$('#scan').hidden=false;
 const [data]=await Promise.all([load(),new Promise(r=>setTimeout(r,still?0:1100))]);
 $('#scan').hidden=true;busy=false;$('#go').classList.remove('busy');$('#go span').textContent='اختبر فكرتي';
 if(!data){out.append(el('div','empty','تعذّر تحميل الفرص الآن. حدّث الصفحة بعد قليل.'));return}
 const all=(data.items||[]).filter(alive),th=themesOf(nt(idea));
 const rows=all.map(o=>({o,r:score(idea,o)})).filter(x=>x.r.s>=3).sort((a,b)=>b.r.s-a.r.s||(a.o.until||'9999').localeCompare(b.o.until||'9999')).slice(0,6);
 const s=el('p','sum');
 s.append(document.createTextNode(th.length?'فهمت فكرتك في مجال ':'ما قدرت أحدد مجال فكرتك بوضوح. '));
 if(th.length)s.append(el('b',null,th.join('، ')));
 s.append(document.createTextNode(`. قارنتها مع ${AR(all.length)} فرصة مفتوحة.`));out.append(s);
 if(!rows.length){out.append(el('div','empty','ما لقيت فرصة قريبة من وصف فكرتك الآن. جرّب تضيف تفاصيل أكثر عن المجال والمستفيد، أو تصفّح كل الفرص من الرادار.'));return}
 const g=el('div','grid'),top=rows[0].r.s;rows.forEach((x,i)=>g.append(card(x.o,x.r,i,top)));
 out.append(el('p','sum',`لقيت ${AR(rows.length)} ${rows.length>2&&rows.length<11?'فرص':'فرصة'} تناسب فكرتك:`),g);
 g.scrollIntoView({behavior:still?'auto':'smooth',block:'start'})}
$('#go').onclick=run;
$('#idea').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))run()});
</script>
</body>
</html>
